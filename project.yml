# XcodeGen spec — the single source of truth for the Xcode project.
# Generate the project with:  xcodegen generate
name: MemoryMap

options:
  bundleIdPrefix: com.jialinong
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  MemoryMap:
    type: application
    platform: iOS
    sources:
      - MemoryMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jialinong.memorymap
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: MemoryMap/Info.plist
      properties:
        CFBundleDisplayName: Memory Map
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: Memory Map reads your photo library on this device to place your photos on the map. Nothing leaves your iPhone.
        NSCalendarsFullAccessUsageDescription: Memory Map reads your calendar events on this device to show where and when things happened. Nothing leaves your iPhone.
        NSCalendarsUsageDescription: Memory Map reads your calendar events on this device to show where and when things happened. Nothing leaves your iPhone.

  MemoryMapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MemoryMapTests
    dependencies:
      - target: MemoryMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jialinong.memorymap.tests
        CODE_SIGN_STYLE: Automatic

schemes:
  MemoryMap:
    build:
      targets:
        MemoryMap: all
        MemoryMapTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MemoryMapTests
